services:
  mongodb:
    image: mongo:8
    command: [mongod, --bind_ip_all]
    ports: ["127.0.0.1:27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 5s
      timeout: 10s
      retries: 20
volumes:
  mongo-data:
